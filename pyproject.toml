[project]
name = "plant-copilot"
version = "0.1.0"
description = "Multi-agent assistant for industrial maintenance data, built on Databricks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark>=4.0,<4.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# .claude/ is workflow-owned (replaced by updates, never edited here), so it is not linted.
extend-exclude = [".claude"]

[tool.ruff.lint]
extend-select = ["I"]
