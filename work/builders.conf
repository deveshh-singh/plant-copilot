# Two Claude accounts (project-owned). Read by .claude/workflow/build.sh and assign.sh (/assign, cbuild). See D-011.
worktree = ../plant-copilot-build   # the builder's folder: a git worktree, relative to the main checkout
config_dir = ~/.claude               # the builder account's CLAUDE_CONFIG_DIR
builder = claude-dev                 # the shell alias that opens the builder account
manager = claude-jo                  # the shell alias that opens the manager account (main checkout)
