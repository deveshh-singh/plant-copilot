# Two Claude accounts (project-owned). Copy to work/builders.conf. Read by .claude/workflow/build.sh (`cbuild T-NNN`).
# The account names are recorded here and in a D-NNN decision, so no session has to guess.
worktree = ../{{project}}-build   # the builder's folder: a git worktree, relative to the main checkout
config_dir = ~/.claude             # the builder account's CLAUDE_CONFIG_DIR
builder = {{claude-dev}}           # the shell alias that opens the builder account
manager = {{claude-jo}}            # the shell alias that opens the manager account (main checkout)
